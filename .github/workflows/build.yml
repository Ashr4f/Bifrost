name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/Bifrost.csproj -c Release

      - name: Assemble Thunderstore package
        id: pkg
        shell: pwsh
        run: |
          $v = (Get-Content thunderstore/manifest.json | ConvertFrom-Json).version_number
          "version=$v" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force -Path pkg/plugins | Out-Null
          Copy-Item src/bin/Release/net472/Bifrost.dll pkg/plugins/
          Get-ChildItem pkg -Recurse -Filter .gitkeep | Remove-Item
          Copy-Item thunderstore/manifest.json, thunderstore/README.md, thunderstore/CHANGELOG.md, thunderstore/icon.png pkg/
          Compress-Archive -Path pkg/* -DestinationPath "Bifrost-$v.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bifrost-${{ steps.pkg.outputs.version }}
          path: pkg/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Bifrost-*.zip
